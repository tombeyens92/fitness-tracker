<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strength Rotation</title>
<meta name="theme-color" content="#14171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#14171b; --surface:#1b1f25; --line:#3a424e;
  --chalk:#e9e7e1; --muted:#98a0ad;
  --push:#f2b01e; --core:#46cfc2; --legs:#9b82ff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --disp:"Anton",Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  --acc:var(--core);
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--ink);}
body{color:var(--chalk);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#app{max-width:660px;margin-inline:auto;padding:22px 16px 70px;}
#app[data-day="push"]{--acc:var(--push);}
#app[data-day="core"]{--acc:var(--core);}
#app[data-day="legs"]{--acc:var(--legs);}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.muted{color:var(--muted);}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px;}
.ghost{color:var(--muted);text-decoration:underline;text-underline-offset:3px;}
.ghost:hover{color:var(--chalk);}
h1,h2,h3,p,ul{margin:0;}

/* ---- level picker ---- */
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);margin-bottom:10px;}
.h1{font-family:var(--disp);font-size:50px;line-height:.94;text-transform:uppercase;margin-bottom:16px;}
.lede{color:var(--muted);max-width:44ch;margin-bottom:26px;}
.level{display:flex;gap:16px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px 18px;margin-bottom:10px;}
.level:hover{border-color:var(--acc);}
.lvl-n{color:var(--acc);font-size:13px;}
.level strong{display:block;font-weight:600;}
.level em{display:block;font-style:normal;color:var(--muted);margin-top:2px;}

/* ---- header ---- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px;}
.menubtn{border:1px solid var(--line);border-radius:2px;padding:7px 12px;color:var(--muted);
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;flex:none;}
.menubtn:hover{border-color:var(--acc);color:var(--chalk);}

/* ---- dial ---- */
.dial-block{display:flex;gap:20px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.dial{flex:none;display:block;}
.wedge{opacity:.34;transform-origin:256px 256px;transform-box:view-box;
  transition:opacity .18s ease, transform .18s cubic-bezier(.2,.8,.3,1);}
.wedge-fill{stroke:none;}
.wedge[data-k="push"] .wedge-fill{fill:var(--push);}
.wedge[data-k="core"] .wedge-fill{fill:var(--core);}
.wedge[data-k="legs"] .wedge-fill{fill:var(--legs);}
.wedge[aria-checked="true"]{opacity:1;}
.wedge[aria-checked="true"][data-k="push"]{transform:translate(13.9px,-8px);}
.wedge[aria-checked="true"][data-k="core"]{transform:translate(0,16px);}
.wedge[aria-checked="true"][data-k="legs"]{transform:translate(-13.9px,-8px);}
@media (hover:hover){
  .wedge[role="radio"][aria-checked="false"]{cursor:pointer;}
  .wedge[role="radio"][aria-checked="false"]:hover{opacity:.62;}
}
.wedge-focus{fill:none;stroke:transparent;stroke-width:12;pointer-events:none;}
.wedge:focus{outline:none;}
.wedge:focus-visible .wedge-focus{stroke:var(--chalk);}
@media (prefers-reduced-motion:reduce){
  .wedge{transition:opacity .18s ease;}
  .wedge[aria-checked="true"]{transform:none;}
}
.legend{flex:1;min-width:180px;}
.legend ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px;}
.legend li{color:var(--muted);}
.legend li.on{color:var(--chalk);}
.legrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;color:inherit;
  padding:4px 6px;margin-left:-6px;border-radius:2px;transition:background .15s,color .15s;}
.legrow:hover{background:var(--surface);color:var(--chalk);}
.legend li.on .legrow{cursor:default;}
.legend li.on .legrow:hover{background:transparent;}
.legend .when{margin-left:auto;font-size:10.5px;}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;}
.pip[data-k="push"]{background:var(--push);}
.pip[data-k="core"]{background:var(--core);}
.pip[data-k="legs"]{background:var(--legs);}
.legend li:not(.on) .pip{background:var(--line);}
.legend li:not(.on) .legrow:hover .pip{background:var(--muted);}

/* ---- muscle toggle ---- */
.bodytoggle{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 10px;border:1px solid var(--line);border-radius:2px;color:var(--muted);
  transition:border-color .2s,color .2s;}
.bodytoggle:hover{border-color:var(--muted);color:var(--chalk);}
.bodytoggle[aria-expanded="true"]{border-color:var(--acc);color:var(--acc);}
.bodytoggle .mini-body{height:64px;width:auto;display:block;pointer-events:none;}
.bodytoggle .mono{font-size:9.5px;letter-spacing:.12em;}

/* ---- muscle map ---- */
.bodymap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:20px;}
.bodies{display:flex;gap:8px;flex:none;}
.body-svg{height:126px;width:auto;display:block;}
.body-label{font-family:var(--mono);font-size:8px;letter-spacing:.14em;fill:var(--muted);text-anchor:middle;}
.bodycap{flex:1;min-width:165px;}
.bodycap .lit{color:var(--acc);margin-bottom:7px;line-height:1.5;}
.capnote{color:var(--muted);font-size:12.5px;line-height:1.5;}

/* ---- banners ---- */
.pvbanner{display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:1px dashed var(--acc);border-radius:2px;padding:9px 12px;margin-bottom:16px;color:var(--acc);}

/* ---- cards ---- */
.list{display:flex;flex-direction:column;gap:12px;}
.card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;padding:14px;transition:opacity .2s,border-color .2s;}
.card.done{opacity:.5;border-color:var(--acc);}
.figbox{width:96px;flex:none;}
.fig{width:100%;height:auto;display:block;}
.fig .floor{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4;fill:none;}
.fig .body *{stroke:var(--chalk);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.9;}
.card.done .fig .body *{stroke:var(--acc);}
.cardbody{flex:1;min-width:0;}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.cardhead h3{font-size:16px;font-weight:600;}
.dose{color:var(--acc);flex:none;}
.cue{color:var(--muted);font-size:13.5px;margin-top:5px;}
.harder{color:var(--acc);margin-top:6px;text-transform:none;letter-spacing:.02em;}
.controls{display:flex;align-items:center;gap:12px;margin-top:11px;flex-wrap:wrap;}
.controls > .timer, .controls > .setdone{margin-left:auto;}
.dots{display:flex;gap:7px;}
.dot{width:30px;height:30px;border:2px solid var(--muted);border-radius:50%;background:transparent;}
.dot:hover{border-color:var(--chalk);}
.dot.half{background:linear-gradient(90deg,var(--acc) 0 50%,transparent 50% 100%);border-color:var(--acc);}
.dot.filled{background:var(--acc);border-color:var(--acc);}
.timer, .setdone{border:1px solid var(--muted);border-radius:2px;padding:7px 12px;color:var(--chalk);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.timer:hover, .setdone:hover{border-color:var(--acc);color:var(--acc);}
.timer.running{border-color:var(--acc);color:var(--acc);}
.swap{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);border-radius:2px;padding:5px 10px;color:var(--muted);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;}
.chip:hover{border-color:var(--acc);color:var(--chalk);}
.chip.on{border-color:var(--acc);color:var(--acc);}
.chip.on[data-k="push"]{border-color:var(--push);color:var(--push);}
.chip.on[data-k="core"]{border-color:var(--core);color:var(--core);}
.chip.on[data-k="legs"]{border-color:var(--legs);color:var(--legs);}

/* ---- finish ---- */
.finish{width:100%;margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:2px;
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.finish.ready{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700;}
.finish.logged{border-style:dashed;color:var(--acc);}

/* ---- streak ---- */
.streak{margin-top:30px;}
.streakhead{display:flex;justify-content:space-between;align-items:baseline;}
.grid{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-top:8px;}
.cell{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:1px;padding:0;}
.cell.hit{background:var(--muted);border-color:var(--muted);}
.cell.hit[data-k="push"]{background:var(--push);border-color:var(--push);}
.cell.hit[data-k="core"]{background:var(--core);border-color:var(--core);}
.cell.hit[data-k="legs"]{background:var(--legs);border-color:var(--legs);}
.cell.editable:not(.hit){border-style:dashed;}
.cell.editable:hover{border-color:var(--chalk);}
.key{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
.key span{display:flex;align-items:center;gap:6px;color:var(--muted);}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.5;}
.hint em{font-style:normal;color:var(--chalk);}

.retest{margin-top:20px;border:1px solid var(--acc);border-radius:2px;padding:14px;}
.retest p{margin-bottom:11px;font-size:13.5px;}
footer{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px;}
footer p{margin-bottom:8px;}
footer strong{color:var(--chalk);font-weight:600;}

/* ---- sheet ---- */
.sheet{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.sheet[hidden]{display:none;}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px;border-bottom:1px solid var(--line);flex:none;}
.sheethead h2{font-family:var(--disp);font-size:24px;text-transform:uppercase;letter-spacing:.02em;}
.sheetbody{overflow-y:auto;padding:8px 16px 40px;max-width:660px;width:100%;margin-inline:auto;
  -webkit-overflow-scrolling:touch;}
.menulist{list-style:none;padding:0;}
.menulist li{border-bottom:1px solid var(--line);}
.menulist button{display:flex;width:100%;text-align:left;gap:14px;align-items:center;padding:16px 2px;}
.menulist strong{display:block;font-weight:600;font-size:15.5px;}
.menulist em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45;}
.menulist .arrow{margin-left:auto;color:var(--muted);flex:none;}
.menulist .danger strong{color:#ff8b7a;}
.sect{padding:16px 0;}
.sect>.mono{display:block;margin-bottom:8px;}
.sect p{color:var(--muted);font-size:13px;line-height:1.55;}
.plan[data-day="push"]{--acc:var(--push);}
.plan[data-day="core"]{--acc:var(--core);}
.plan[data-day="legs"]{--acc:var(--legs);}
.ptable{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
.ptable th,.ptable td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--muted);
  font-family:var(--mono);letter-spacing:.05em;}
.ptable th:first-child,.ptable td:first-child{text-align:left;}
.ptable .pname{color:var(--chalk);font-size:13px;font-family:inherit;letter-spacing:0;}
.ptable .now{color:var(--acc);}
.planwhy{list-style:none;padding:0;margin-top:16px;display:flex;flex-direction:column;gap:8px;
  font-size:12.5px;color:var(--muted);line-height:1.5;}
.planwhy li.on{color:var(--chalk);}
.planwhy .mono{color:var(--acc);margin-right:7px;}
.ta{width:100%;background:var(--surface);color:var(--chalk);border:1px solid var(--line);border-radius:2px;
  padding:10px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.5;margin-top:10px;}
.io{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.io button{border:1px solid var(--line);border-radius:2px;padding:9px 13px;color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.io button:hover{border-color:var(--acc);color:var(--chalk);}
.io-msg{color:var(--acc);margin-top:12px;font-size:12.5px;line-height:1.5;}
.hidden-input{display:none;}
.install{margin-top:20px;border:1px dashed var(--acc);border-radius:2px;padding:12px;color:var(--acc);
  font-size:12.5px;line-height:1.5;}

@media (max-width:500px){
  .legend{min-width:0;flex-basis:calc(100% - 146px);}
  .bodytoggle{flex-basis:100%;flex-direction:row;gap:10px;justify-content:center;padding:6px 10px;}
  .bodytoggle .mini-body{height:34px;}
}
@media (max-width:400px){
  .h1{font-size:42px;}
  .card{flex-direction:column;}
  .figbox{width:112px;}
  .bodymap{gap:12px;padding:12px;}
  .body-svg{height:112px;}
  .bodycap{min-width:140px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheettitle">
  <div class="sheethead">
    <h2 id="sheettitle">Menu</h2>
    <button class="ghost mono" data-act="sheet-back" id="sheetback" hidden>back</button>
    <button class="menubtn" data-act="sheet-close">close</button>
  </div>
  <div class="sheetbody" id="sheetbody"></div>
</div>

<input type="file" id="fileinput" class="hidden-input" accept=".json,application/json">

<script>
"use strict";

/* ================= data ================= */

const EX = {
  pushup:{name:"Pushups",base:[6,12,20],cue:"Elbows about 45\u00b0 from your ribs, not flared wide. Beginner: drop to knees.",harder:"Decline \u2014 feet up on a chair"},
  pike_floor:{name:"Pike pushups \u00b7 floor",short:"Floor",base:[5,8,12],cue:"Hands on the floor, hips high, crown of your head toward the floor between your hands. Knees soft is fine.",harder:"Feet elevated on a step"},
  pike_chair:{name:"Pike pushups \u00b7 chair",short:"Chair",base:[5,8,12],cue:"Hands on a chair seat. Hips high, head lowering between your hands. Bend the knees as much as you need.",harder:"Drop to the floor"},
  pike_counter:{name:"Pike pushups \u00b7 counter",short:"Counter",base:[5,8,12],cue:"Hands on a kitchen counter, feet on the floor, hips high. The higher your hands, the less hamstring length you need.",harder:"Drop to a chair"},
  dip:{name:"Chair dips",base:[6,10,15],cue:"Stay close to the bench. Shoulders down, never shrugged up to your ears.",harder:"Legs straight out in front"},
  plank:{name:"Plank",hold:true,base:[20,40,60],cue:"Squeeze your glutes and tuck the ribs down. A sagging plank trains nothing.",harder:"Lift one foot, alternate every 5s"},
  sideplank:{name:"Side plank",hold:true,side:true,base:[15,25,40],cue:"Stack the hips and drive the bottom hip up toward the ceiling.",harder:"Top leg raised"},
  deadbug:{name:"Dead bug",side:true,base:[8,10,12],cue:"Lower back stays glued to the floor. Slow beats far \u2014 stop where it lifts.",harder:"Hold a book in the moving hand"},
  hollow:{name:"Hollow hold",hold:true,base:[15,25,40],cue:"Press the lower back into the floor. If it lifts, raise the legs higher.",harder:"Arms fully overhead"},
  squat:{name:"Squats",base:[10,18,25],cue:"Knees track over your toes, weight through the midfoot.",harder:"3-second lower, or single-leg to a chair"},
  lunge:{name:"Lunges",side:true,base:[6,10,14],cue:"Back knee kisses the floor, front shin stays close to vertical.",harder:"Rear foot elevated on a chair"},
  bridge:{name:"Glute bridge",base:[12,15,20],cue:"Drive through the heels, ribs down \u2014 squeeze glutes, don't arch the back.",harder:"One leg at a time"},
  row:{name:"Inverted rows",short:"Table row",base:[6,10,14],cue:"Under a sturdy table. Pull chest to the edge, shoulder blades back and down.",harder:"Feet up on a chair"},
  ytw:{name:"Y-T-W raises",short:"Y-T-W",base:[6,8,10],cue:"Face down, forehead on the floor. Lift the arms a few cm and hold each shape \u2014 Y, then T, then W. That's one rep.",harder:"Pause 3 seconds in each shape"}
};

const DAYS = [
  {id:"A",name:"Push",focus:"chest \u00b7 shoulders \u00b7 triceps",key:"push",ex:["pushup",["pike_floor","pike_chair","pike_counter"],"dip"]},
  {id:"B",name:"Core",focus:"abs \u00b7 obliques \u00b7 stabilisers",key:"core",ex:["plank","sideplank","deadbug","hollow"]},
  {id:"C",name:"Legs + Pull",focus:"quads \u00b7 glutes \u00b7 upper back",key:"legs",ex:["squat","lunge","bridge",["row","ytw"]]}
];

const WEEKS = [
  {sets:2,rep:0,hold:0,note:"Groove the movements. Half of what you could do."},
  {sets:3,rep:0,hold:10,note:"Same reps, one more set. Holds get 10 seconds longer."},
  {sets:3,rep:2,hold:20,note:"Add two reps per set. This is the week it starts to bite."},
  {sets:3,rep:2,hold:20,note:"Same volume, harder variations. Then retest and start over."}
];

const LEVELS = ["Beginner","Intermediate","Advanced"];
const LEVEL_HINT = ["under 10 pushups / 30s plank","10\u201325 pushups / 30\u201360s plank","25+ pushups / 60s+ plank"];

const KEY = "strength:v1";
const SLOTS = DAYS.flatMap(d => d.ex.filter(Array.isArray));
const known = id => Object.prototype.hasOwnProperty.call(EX, id);
const halves = id => !!(EX[id] && EX[id].side);
const unitsFor = (id, sets) => halves(id) ? sets*2 : sets;
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= figures ================= */

const fig = (label, inner) =>
  `<svg viewBox="0 0 100 62" class="fig" role="img" aria-label="${esc(label)}">
     <line class="floor" x1="6" y1="54" x2="94" y2="54"/><g class="body">${inner}</g></svg>`;
const pl = pts => `<polyline points="${pts}"/>`;
const ci = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;

const FIGS = {
  pushup: fig("Pushup", pl("14,50 40,42 62,34")+ci(70,31,5)+pl("62,34 64,50")),
  pike_floor: fig("Pike pushup on the floor", pl("16,50 44,18 68,40")+pl("68,40 78,50")+ci(73,47,5)),
  pike_chair: fig("Pike pushup, hands on a chair", pl("62,38 94,38")+pl("90,38 90,54")+pl("14,52 44,20 68,36")+ci(74,41,5)+pl("68,36 79,37")),
  pike_counter: fig("Pike pushup, hands on a counter", pl("64,24 94,24")+pl("90,24 90,54")+pl("14,52 44,22 70,32")+ci(76,36,5)+pl("70,32 81,25")),
  dip: fig("Chair dip", pl("8,36 34,36")+pl("12,36 12,52")+pl("30,36 30,52")+ci(38,18,5)+pl("40,25 46,42 70,48 80,50")+pl("40,25 34,36")),
  plank: fig("Forearm plank", pl("14,48 42,40 66,32")+ci(74,30,5)+pl("66,32 68,48 82,48")),
  sideplank: fig("Side plank", pl("16,50 44,38 66,28")+ci(76,24,5)+pl("66,28 64,50")+pl("66,28 72,10")),
  deadbug: fig("Dead bug", pl("26,48 58,48")+ci(20,45,5)+pl("30,48 24,28")+pl("58,48 74,32 84,38")+pl("58,48 80,52")),
  hollow: fig("Hollow hold", '<path d="M 26,40 Q 44,50 62,42"/>'+ci(24,34,5)+pl("27,38 14,28")+pl("61,42 84,28")),
  squat: fig("Squat", pl("30,50 52,38 34,34 30,20")+ci(28,13,5)+pl("31,21 52,24")),
  lunge: fig("Lunge", pl("66,50 66,32 46,26")+pl("46,26 26,44 18,50")+pl("46,26 46,15")+ci(46,9,5)+pl("46,18 52,28")),
  bridge: fig("Glute bridge", pl("66,50 66,32 44,32 24,44")+ci(17,46,5)+pl("24,46 34,51")),
  row: fig("Inverted row", pl("12,14 88,14")+pl("16,46 44,42 66,38")+ci(74,36,5)+pl("66,38 68,15")),
  ytw: fig("Prone Y-T-W raise", pl("16,52 36,50 62,48")+ci(70,46,5)+pl("62,48 80,38")+pl("62,48 76,33"))
};

const HARD_FIGS = {

function defaults(){
  const choices = {};
  SLOTS.forEach(o => { choices[o[0]] = o[0]; });
  return {level:null,cycle:0,sessions:0,logBase:0,log:[],logDetail:{},choices,progress:{},progressDate:today()};
}

function sanitize(v, fallbackLevel){
  if(!v || typeof v !== "object") return null;
  const level = (typeof v.level === "number" && v.level >= 0 && v.level <= 2) ? v.level : fallbackLevel;
  if(typeof level !== "number") return null;
  if(typeof v.sessions !== "number" || v.sessions < 0 || !Array.isArray(v.log)) return null;

  const log = v.log.filter(d => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const detail = {};
  if(v.logDetail && typeof v.logDetail === "object"){
    for(const d in v.logDetail){
      if(log.includes(d) && DAYS.some(x => x.key === v.logDetail[d])) detail[d] = v.logDetail[d];
    }
  }
  if(Math.round(v.sessions) === log.length){
    log.forEach((d,i) => { if(!detail[d]) detail[d] = DAYS[i%3].key; });
  }
  const progress = {};
  if(v.progressDate === today() && v.progress && typeof v.progress === "object"){
    for(const id in v.progress){
      const n = v.progress[id];
      if(known(id) && typeof n === "number" && n >= 0) progress[id] = Math.min(6, Math.round(n));
    }
  }
  const choices = {};
  SLOTS.forEach(opts => {
    const k = opts[0], picked = v.choices && v.choices[k];
    if(opts.includes(picked)) choices[k] = picked;
    else if(k === "row" && opts.includes(v.pullChoice)) choices[k] = v.pullChoice;
    else choices[k] = k;
  });
  return {
    level, cycle:[0,1,2].includes(v.cycle) ? v.cycle : 0,
    sessions: Math.round(v.sessions),
    logBase: (typeof v.logBase === "number" && v.logBase >= 0) ? Math.round(v.logBase) : 0,
    log, logDetail:detail, choices, progress, progressDate: today()
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const c = sanitize(JSON.parse(raw), null); if(c) S = c; }
  }catch(e){ /* corrupt or unavailable storage: start fresh */ }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ ui.msg = "Storage is full or blocked — your last change may not survive a reload."; }
}

const slotFor = (d,id) => (d||day()).ex.find(e => Array.isArray(e) && e.includes(id));
const targetFor = (id,w) => EX[id].base[S.level] + (EX[id].hold ? WEEKS[w-1].hold : WEEKS[w-1].rep);

/* Three-segment donut icon. Paths and geometry come from segment-icon-prompt.md
   (viewBox 512, outer r=230, inner r=141, 13° gaps). Colors are fixed by
   position (amber/teal/purple); labels are supplied by the caller. */
const SEGMENT_PATHS = [
  "M466.9 347.7A230 230 0 0 0 282.0 27.5L272.0 115.9A141 141 0 0 1 385.3 312.2Z",
  "M71.1 392.8A230 230 0 0 0 440.9 392.8L369.3 339.9A141 141 0 0 1 142.7 339.9Z",
  "M230.0 27.5A230 230 0 0 0 45.1 347.7L126.7 312.2A141 141 0 0 1 240.0 115.9Z"
];
let _segIconWarned = false;

function segmentIcon(opts){
  const size = opts.size || 230;
  const label = opts.label || "Segment icon";
  const wantInteractive = opts.interactive !== false;
  const canInteract = wantInteractive && size >= 88;
  if(wantInteractive && !canInteract && !_segIconWarned){
    _segIconWarned = true;
    if(typeof console !== "undefined" && console.warn){
      console.warn("segmentIcon: size " + size + "px < 88px — forcing non-interactive to keep tap targets ≥ 44px");
    }
  }
  const parts = opts.segments.map((s, i) => {
    const active = i === opts.value;
    const path = SEGMENT_PATHS[i];
    const attrs = canInteract
      ? `role="radio" aria-checked="${active}" aria-label="${esc(s.label)}" tabindex="${active?0:-1}"`
        + (active ? "" : ` data-act="${opts.action||"segment"}" data-i="${i}"`)
      : `aria-hidden="true"`;
    return `<g class="wedge" data-k="${s.key}" ${attrs}>
      <path class="wedge-fill" d="${path}"/>
      <path class="wedge-focus" d="${path}"/>
    </g>`;
  }).join("");
  const svgRole = canInteract
    ? `role="radiogroup" aria-label="${esc(label)}"`
    : `role="img" aria-label="${esc(label)}"`;
  return `<svg viewBox="0 0 512 512" class="dial" width="${size}" height="${size}" ${svgRole}>${parts}</svg>`;
}

function dial(){
  return segmentIcon({
    value: S.cycle,
    segments: DAYS.map(x => ({key:x.key, label:x.name})),
    size: 126,
    interactive: true,
    action: "setcycle",
    label: "Rotation day"
  });
}

function cardsHTML(){
  const W = Wk(), hard = ui.preview || week() === 4;
  return exList().map(id => {
    const e = EX[id], t = targetFor(id, week()), done = S.progress[id]||0, max = unitsFor(id, W.sets);
    const slot = slotFor(null, id);
    const dots = Array.from({length:W.sets}, (_,i) => {
      const full = halves(id) ? done >= (i+1)*2 : done > i;
      const half = halves(id) && done === i*2+1;
      return `<button class="dot${full?" filled":""}${half?" half":""}" data-act="dot" data-id="${id}" data-i="${i}"
        aria-pressed="${full}" aria-label="Set ${i+1}"></button>`;
    }).join("");
    const running = ui.timer && ui.timer.id === id;
    const tlabel = running ? ui.timer.left + "s \u2014 stop"
      : halves(id) ? `start ${t}s \u00b7 ${done%2===0?"1st side":"2nd side"}` : `start ${t}s`;
    const dlabel = halves(id) ? `${done%2===0?"1st":"2nd"} side done` : "mark set done";
    const showSetDone = !e.hold && done < max;
    return `<article class="card${done>=max?" done":""}">
      <div class="figbox">${(hard && HARD_FIGS[id]) || FIGS[id]}</div>
      <div class="cardbody">
        <div class="cardhead"><h3>${esc(e.name)}</h3>
          <span class="mono dose">${W.sets} \u00d7 ${e.hold?t+"s":t}${e.side?" / side":""}</span></div>
        ${slot ? `<div class="swap" role="group" aria-label="Variant">${slot.filter(known).map(p =>
          `<button class="chip${p===id?" on":""}" data-act="slot" data-slot="${slot[0]}" data-pick="${p}"
            aria-pressed="${p===id}">${esc(EX[p].short||EX[p].name)}</button>`).join("")}</div>` : ""}
        <p class="cue">${esc(e.cue)}</p>
        ${hard ? `<p class="mono harder">week 4 \u2192 ${esc(e.harder)}${HARD_FIGS[id]?"":" (same position, harder tempo)"}</p>` : ""}
        <div class="controls">
          <div class="dots" role="group" aria-label="Sets for ${esc(e.name)}">${dots}</div>
          ${e.hold ? `<button class="timer${running?" running":""}" data-act="timer" data-id="${id}" data-t="${t}">${tlabel}</button>` : ""}
          ${showSetDone ? `<button class="setdone" data-act="setdone" data-id="${id}">${dlabel}</button>` : ""}
        </div>
      </div></article>`;
  }).join("");
}

function gridHTML(){
  return Array.from({length:21}, (_,i) => {
    const dt = new Date(); dt.setDate(dt.getDate()-(20-i));
    const iso = new Date(dt.getTime()-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    const hit = S.log.includes(iso), k = S.logDetail[iso] || "";
    const cls = `cell${hit?" hit":""}${ui.editGrid?" editable":""}`;
    const label = iso + (hit && k ? " \u00b7 " + k : "");
    return ui.editGrid
      ? `<button class="${cls}" data-k="${k}" data-act="cell" data-iso="${iso}" title="${label}" aria-label="${label}"></button>`
      : `<i class="${cls}" data-k="${k}" title="${label}"></i>`;
  }).join("");
}

      <button data-act="download">download file</button>
      <button data-act="restore">restore from text</button>
      <button data-act="loadfile">load a file</button>
    </div>
    ${ui.msg ? `<p class="io-msg">${esc(ui.msg)}</p>` : ""}</div>`;
}

function installHTML(){
  const standalone = (typeof window.matchMedia === "function" && window.matchMedia("(display-mode: standalone)").matches)
    || window.navigator.standalone === true;
  if(standalone) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="install">${ios
    ? "Install it: tap Share, then \u201cAdd to Home Screen\u201d. That also stops Safari clearing your log after a week of not opening it."
    : "Install it from your browser menu (\u201cInstall app\u201d or \u201cAdd to Home screen\u201d) to launch it fullscreen and keep it offline."}</div>`;
}

/* ================= actions ================= */

function bump(id, idx, auto){
  const cur = S.progress[id]||0, max = unitsFor(id, Wk().sets);
  let next;
  if(auto) next = Math.min(max, cur+1);
  else if(halves(id)){ const lo = idx*2; next = cur <= lo ? lo+1 : cur === lo+1 ? lo+2 : lo; }
  else next = cur === idx+1 ? idx : idx+1;
  S.progress[id] = next; S.progressDate = today();
  save(); render();
}

function stopTimer(){
  if(ui.tick) clearInterval(ui.tick);
  ui.tick = null; ui.timer = null;
}

function startTimer(id, t){
  stopTimer();
  ui.timer = {id, left:t};
  ui.tick = setInterval(() => {
    if(!ui.timer) return stopTimer();
    ui.timer.left--;
    if(ui.timer.left <= 0){ const x = ui.timer.id; stopTimer(); bump(x, null, true); return; }
    const btn = document.querySelector('.timer[data-id="'+id+'"]');
    if(btn) btn.textContent = ui.timer.left + "s — stop";
  }, 1000);
  render();
}

function finishDay(){
  const d = today();
  if(S.log.includes(d) && !confirm("Today is already logged. Log a second session anyway?\n\nThis advances the rotation and your session count again — only do this if you genuinely trained twice.")) return;
  if(!S.log.includes(d)) S.log = S.log.concat([d]).sort();
  S.logDetail[d] = day().key;
  S.sessions++; S.cycle = (S.cycle+1)%3; S.progress = {}; S.progressDate = d;
  stopTimer(); save(); render();
}

function cycleCell(iso){
  const order = DAYS.map(d => d.key);
  if(!S.log.includes(iso)){ S.log = S.log.concat([iso]).sort(); S.logDetail[iso] = order[0]; }
  else {
    const i = order.indexOf(S.logDetail[iso]);
    if(i === -1) S.logDetail[iso] = order[0];
    else if(i < order.length-1) S.logDetail[iso] = order[i+1];
    else { S.log = S.log.filter(d => d !== iso); delete S.logDetail[iso]; }
  }
  const last = S.log.length ? S.log[S.log.length-1] : null;
  const li = last ? order.indexOf(S.logDetail[last]) : -1;
  const c = li === -1 ? S.cycle : (li+1)%3;
  if(c !== S.cycle) S.progress = {};
  S.cycle = c;
  S.sessions = Math.max(0, S.log.length - (S.logBase||0));
  save(); render();
}

function restore(text){
  let v;
  try{ v = JSON.parse(text); }
  catch(e){ ui.msg = "That isn't valid JSON. Nothing changed."; renderSheet(); return; }
  const clean = sanitize(v, S.level);
  if(!clean){ ui.msg = "That doesn't look like a strength log. Nothing changed."; renderSheet(); return; }
  S = clean; save(); render();
  ui.msg = `Restored — ${S.sessions} sessions, ${S.log.length} days logged.`;
  renderSheet();
}

/* ================= events ================= */

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;

  if(a === "menu"){ openSheet(null); return; }
  if(a === "sheet-close"){ closeSheet(); return; }
  if(a === "sheet-back"){ ui.panel = null; renderSheet(); return; }
  if(a === "open"){
    const p = el.dataset.panel;
    if(p === "dates"){
      ui.editGrid = true; closeSheet(); render();
      const g = document.getElementById("grid");
      if(g && g.scrollIntoView) g.scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    openSheet(p); return;
  }
  if(a === "level"){ S.level = +el.dataset.i; save(); closeSheet(); render(); return; }
  if(a === "dot"){ bump(el.dataset.id, +el.dataset.i, false); return; }
  if(a === "timer"){
    const id = el.dataset.id;
    if(ui.timer && ui.timer.id === id){ stopTimer(); render(); }
    else startTimer(id, +el.dataset.t);
    return;
  }
  if(a === "slot"){ S.choices[el.dataset.slot] = el.dataset.pick; save(); render(); return; }
  if(a === "setdone"){ bump(el.dataset.id, null, true); return; }
  if(a === "togglebody"){ ui.bodyOpen = !ui.bodyOpen; render(); return; }
  if(a === "finish"){ finishDay(); return; }
  if(a === "toggle-edit"){ ui.editGrid = !ui.editGrid; render(); return; }
  if(a === "cell"){ cycleCell(el.dataset.iso); return; }
  if(a === "planday"){ ui.planDay = +el.dataset.i; renderSheet(); return; }
  if(a === "preview"){ ui.preview = !ui.preview; renderSheet(); render(); return; }
  if(a === "preview-off"){ ui.preview = false; render(); return; }
  if(a === "setcycle"){
    const i = +el.dataset.i;
    if(i === S.cycle) return;
    S.cycle = i; S.progress = {}; save(); renderSheet(); render(); return;
  }
  if(a === "restart"){
    if(!confirm("Restart at week 1 with a fresh level? Your logged days are kept.")) return;
    S.sessions = 0; S.logBase = S.log.length; S.cycle = 0; S.progress = {}; S.level = null;
    save(); render(); return;
  }
  if(a === "do-reset"){
    if(!confirm("Clear all sessions and history? This cannot be undone.")) return;
    S.cycle = 0; S.sessions = 0; S.logBase = 0; S.log = []; S.logDetail = {}; S.progress = {};
    save(); closeSheet(); render(); return;
  }
  if(a === "copy"){
    const ta = document.getElementById("ta");
    ui.draft = ta.value;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ui.draft)
        .then(() => { ui.msg = "Copied. Paste it into a note or a file somewhere safe."; renderSheet(); })
        .catch(() => { ta.focus(); ta.select(); ui.msg = "Clipboard blocked — the text is selected, press Ctrl+C (Cmd+C on Mac)."; renderSheet(); });
    } else { ta.focus(); ta.select(); ui.msg = "The text is selected — press Ctrl+C (Cmd+C on Mac)."; renderSheet(); }
    return;
  }
  if(a === "download"){
    ui.draft = document.getElementById("ta").value;
    try{
      const url = URL.createObjectURL(new Blob([ui.draft], {type:"application/json"}));
      const link = document.createElement("a");
      link.href = url; link.download = "strength-log-" + today() + ".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      ui.msg = "File saved. If nothing appeared, use Copy instead.";
    }catch(e){ ui.msg = "Download failed here — use Copy instead."; }
    renderSheet(); return;
  }
  if(a === "restore"){ restore(document.getElementById("ta").value); return; }
  if(a === "loadfile"){ document.getElementById("fileinput").click(); return; }
});

document.addEventListener("input", ev => {
  if(ev.target.id === "ta") ui.draft = ev.target.value;
});

document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && !sheet.hidden){ closeSheet(); return; }
  const t = ev.target;
  if(t && t.classList && t.classList.contains("wedge") && t.getAttribute("role") === "radio"){
    const dir = (ev.key === "ArrowRight" || ev.key === "ArrowDown") ? 1
      : (ev.key === "ArrowLeft" || ev.key === "ArrowUp") ? -1 : 0;
    if(dir !== 0){
      ev.preventDefault();
      const n = (S.cycle + dir + DAYS.length) % DAYS.length;
      if(n !== S.cycle){
        S.cycle = n; S.progress = {}; ui.focusDial = true; save(); render();
      }
    } else if(ev.key === "Enter" || ev.key === " "){
      ev.preventDefault();
    }
  }
});

document.getElementById("fileinput").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { ui.draft = String(r.result); restore(ui.draft); };
  r.onerror = () => { ui.msg = "That file couldn't be read. Try pasting the text instead."; renderSheet(); };
  r.readAsText(f);
  ev.target.value = "";
});

window.addEventListener("beforeinstallprompt", e => { ui.deferredPrompt = e; });

/* ================= boot ================= */

load();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
